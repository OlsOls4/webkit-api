name: Deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1003933593053/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@webkit-api.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        run: |
          gcloud run deploy webkit-api --source . --project webkit-api --region us-central1 \
            --allow-unauthenticated --memory 512Mi --cpu 1 --max-instances 1 --quiet
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe webkit-api --project webkit-api --region us-central1 --format='value(status.url)')
          curl -fsS "$URL/health"
          curl -fsS "$URL/email/validate?email=test@gmail.com"
