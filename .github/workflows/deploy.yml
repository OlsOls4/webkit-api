name: Deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1003933593053/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@webkit-api.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fetch DB-IP Lite databases (CC BY 4.0)
        run: |
          for f in country asn; do
            for m in $(date -u +%Y-%m) $(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m); do
              curl -sfL "https://download.db-ip.com/free/dbip-$f-lite-$m.mmdb.gz" -o /tmp/$f.gz && break
            done
            gunzip -c /tmp/$f.gz > geoip/$f.mmdb
          done
          ls -la geoip
      - name: Build UK postcode DB (OS Code-Point Open, OGL v3) and tokenizer cache
        run: |
          pip install -q openpyxl tiktoken==0.14.0
          curl -sfL "https://api.os.uk/downloads/v1/products/CodePointOpen/downloads?area=GB&format=CSV&redirect" -o /tmp/codepo.zip
          python ukpostcode/build.py /tmp/codepo.zip ukpostcode/postcodes.sqlite
          TIKTOKEN_CACHE_DIR=llmkit/tiktoken_cache python -c "import tiktoken; [tiktoken.get_encoding(e) for e in ('o200k_base','cl100k_base','p50k_base','r50k_base')]"
          ls -la ukpostcode llmkit/tiktoken_cache
      - name: Deploy
        env:
          PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}
        run: |
          ENVFLAG=""
          if [ -n "$PROXY_SECRET" ]; then ENVFLAG="--set-env-vars=RAPIDAPI_PROXY_SECRET=$PROXY_SECRET"; fi
          gcloud run deploy webkit-api --source . --project webkit-api --region us-central1 \
            --allow-unauthenticated --memory 1Gi --cpu 1 --max-instances 1 --quiet $ENVFLAG > out.txt 2>&1 || {
            echo "::error::$(tail -c 1500 out.txt | tr '\n' ' ')"; exit 1; }
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe webkit-api --project webkit-api --region us-central1 --format='value(status.url)')
          curl -fsS "$URL/health"
          # Direct access must be blocked (RapidAPI-only gate); expect 403
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/geo/lookup?ip=8.8.8.8"); echo "direct=$code"; [ "$code" = "403" ]
          curl -fsS -X POST -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$URL/mcp" | grep -q fraudkit_score
