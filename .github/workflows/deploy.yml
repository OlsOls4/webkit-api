name: Deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1003933593053/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@webkit-api.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        env:
          PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}
        run: |
          ENVFLAG=""
          if [ -n "$PROXY_SECRET" ]; then ENVFLAG="--set-env-vars=RAPIDAPI_PROXY_SECRET=$PROXY_SECRET"; fi
          gcloud run deploy webkit-api --source . --project webkit-api --region us-central1 \
            --allow-unauthenticated --memory 512Mi --cpu 1 --max-instances 1 --quiet $ENVFLAG > out.txt 2>&1 || {
            echo "::error::$(tail -c 1500 out.txt | tr '\n' ' ')"; exit 1; }
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe webkit-api --project webkit-api --region us-central1 --format='value(status.url)')
          curl -fsS "$URL/health"
          curl -fsS -o /dev/null "$URL/qrkit/qr?text=hi"
          curl -fsS -o /dev/null "$URL/text/stats?text=hello%20world"
