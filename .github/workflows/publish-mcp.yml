name: Publish to MCP Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mcp-registry/**"]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish all servers
        run: |
          fail=0
          for d in mcp-registry/*/; do
            echo "== $d"; (cd "$d" && ../../mcp-publisher publish) || { echo "::warning::publish failed for $d"; fail=1; }
          done
          exit $fail
